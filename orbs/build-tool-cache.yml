version: 2.1

commands:
  with_build_tool_cache:
    description: Runs the given steps with remote caching configured for the given build tool.
    parameters:
      tool:
        type: enum
        enum: ["gradle", "bazel"]
        description: "The build tool to configure remote caching for."
      steps:
        type: steps
        description: "The steps to run within the build tool cache."
      cache-prefix:
        type: string
        default: ""
        description: "The cache prefix to use for the cache server."
    steps:
      - run: echo << parameters.cache-prefix >>
      - run:
          name: Start cache server
          command: circleci run cache server start --cache-prefix "<< parameters.tool >>/<< parameters.cache-prefix >>"
          background: true
      - run:
          name: Configure << parameters.tool >>
          command: circleci run cache configure << parameters.tool >>
      - steps: << parameters.steps >>
      - run:
          name: Stop cache server
          command: circleci run cache server stop
          when: always
